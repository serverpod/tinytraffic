<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Traffic Cars</title>
<style>
  :root { --bg: #eef0f3; --panel: #ffffffee; --text: #1d2026; --muted: #667; --line: #d5d9e0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16181c; --panel: #23262bee; --text: #e8eaee; --muted: #99a; --line: #3a3e45; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  canvas { display: block; }
  #panel { position: fixed; top: 12px; left: 12px; width: 250px; padding: 14px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 20px #0002; }
  #panel h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; color: var(--muted); }
  input[type=range] { width: 130px; }
  select { width: 130px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  @media (max-width: 520px) { #panel { left: 8px; right: 8px; width: auto; top: auto; bottom: 8px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="panel">
  <h1>Tiny Traffic cars</h1>
  <label>Car <select id="car"><option value="all">All</option></select></label>
  <label>Paint <input type="color" id="paint" value="#2b49a6"></label>
  <label>Glass <input type="color" id="glass" value="#10262f"></label>
  <label>Glass opacity <input type="range" id="opacity" min="0.2" max="1" step="0.01" value="1"></label>
  <label>Steer <input type="range" id="steer" min="-35" max="35" step="1" value="0"></label>
  <label>Speed <input type="range" id="speed" min="0" max="20" step="0.5" value="0"></label>
  <label>Reset paint <button id="reset">Reference</button></label>
  <div class="hint">Drag to orbit. Every car is one GLB: <code>body</code> plus four
    <code>wheel_*</code> nodes pivoting on their hubs; materials <code>Paint</code> and
    <code>Window</code> are swappable.</div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const NAMES = ['sedan', 'coupe', 'hatchback', 'suv', 'pickup', 'van', 'wagon'];

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.body).getPropertyValue('--bg').trim());
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(6, 12, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 10, bottom: -10 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
camera.position.set(14, 11, 18);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;

/** A loaded car, rigged the way a game would use it. */
class Car {
  constructor(name, gltf) {
    this.name = name;
    this.root = gltf.scene;
    this.info = this.root.getObjectByName(`car_${name}`).userData; // glTF extras
    this.wheels = [];
    this.front = [];
    this.root.traverse((n) => {
      if (n.isMesh) n.castShadow = true;
      if (n.name.startsWith('wheel_')) {
        n.rotation.order = 'YXZ'; // steer about Y, then spin about the axle (X)
        this.wheels.push(n);
        if (n.name.startsWith('wheel_front')) this.front.push(n);
      }
    });
    // Per-car copies of the swappable materials.
    this.paint = this.cloneMaterial(this.info.paintMaterial);
    this.glass = this.cloneMaterial(this.info.windowMaterial);
    this.referencePaint = '#' + this.paint.color.getHexString(THREE.SRGBColorSpace);
    this.spin = 0;
  }
  cloneMaterial(name) {
    let copy = null;
    this.root.traverse((n) => {
      if (!n.isMesh) return;
      const swap = (m) => (m.name === name ? (copy ??= m.clone()) : m);
      n.material = Array.isArray(n.material) ? n.material.map(swap) : swap(n.material);
    });
    return copy;
  }
  setPaint(hex) { this.paint.color.set(hex); }
  setGlass(hex, opacity) {
    this.glass.color.set(hex);
    this.glass.transparent = opacity < 1;
    this.glass.opacity = opacity;
  }
  update(dt, steerDeg, speed) {
    this.spin += (speed * dt) / this.info.wheelRadius;
    for (const w of this.wheels) {
      w.rotation.x = this.spin;
      w.rotation.y = this.front.includes(w) ? THREE.MathUtils.degToRad(steerDeg) : 0;
    }
  }
}

const cars = [];
const loader = new GLTFLoader();
const sel = document.getElementById('car');
await Promise.all(NAMES.map(async (name, i) => {
  const car = new Car(name, await loader.loadAsync(`car_${name}.glb`));
  const row = i < 4 ? 0 : 1, inRow = row ? NAMES.length - 4 : 4;
  car.root.position.set(((i % 4) - (inRow - 1) / 2) * 5.6, 0, (row ? 1 : -1) * 3.4);
  car.root.rotation.y = Math.PI / 2;
  scene.add(car.root);
  cars[i] = car;
}));
for (const name of NAMES) sel.append(new Option(name, name));

const ui = (id) => document.getElementById(id);
const targets = () => cars.filter((c) => sel.value === 'all' || c.name === sel.value);
ui('paint').oninput = (e) => targets().forEach((c) => c.setPaint(e.target.value));
const glass = () => targets().forEach((c) => c.setGlass(ui('glass').value, +ui('opacity').value));
ui('glass').oninput = glass;
ui('opacity').oninput = glass;
ui('reset').onclick = () => targets().forEach((c) => c.setPaint(c.referencePaint));
sel.onchange = () => { const c = targets()[0]; ui('paint').value = c.referencePaint; };
Object.assign(window, { cars, camera, controls }); // for poking at from the console

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  for (const c of cars) c.update(dt, +ui('steer').value, +ui('speed').value);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
