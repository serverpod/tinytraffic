<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Studio</title>
<!-- Temporary tool for composing the Tiny Traffic app icon. Safe to delete. -->
<style>
  :root {
    --surface: #ffffff; --border: #dcd9d0; --text: #1d1c1a; --muted: #6d6a62;
    --accent: #1e6bff; --bg: #ecebe6; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1f1f1d; --border: #363632; --text: #ecebe6; --muted: #9a978e;
      --accent: #5b93ff; --bg: #151514; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1f1f1d; --border: #363632; --text: #ecebe6; --muted: #9a978e;
    --accent: #5b93ff; --bg: #151514; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; gap: 16px; padding: 16px; overflow: hidden;
  }
  .stage {
    flex: 1; min-width: 0; display: grid; place-items: center; position: relative;
  }
  .frame { position: relative; width: min(100%, calc(100vh - 32px)); aspect-ratio: 1; }
  .frame canvas { width: 100%; height: 100%; display: block; border-radius: 4px; touch-action: none; cursor: grab; }
  .frame canvas:active { cursor: grabbing; }
  .mask { position: absolute; inset: 0; pointer-events: none; }
  .panel {
    width: 300px; flex: none; overflow-y: auto; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
  }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
  .ctl { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px; align-items: center; margin: 4px 0; }
  .ctl output { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 6px 0; }
  label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }
  input[type="color"] { width: 36px; height: 24px; border: 1px solid var(--border); border-radius: 6px; padding: 0; background: none; }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  @media (max-width: 720px) {
    body { flex-direction: column; overflow: auto; padding: 16px; }
    .frame { width: 100%; }
    .panel { width: 100%; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
    <svg class="mask" id="mask" viewBox="0 0 1024 1024" preserveAspectRatio="none"></svg>
    <div class="loading" id="loading">Loading models…</div>
  </div>
</div>

<div class="panel">
  <h1>Icon Studio</h1>
  <div class="sub">Drag the image to orbit, scroll to zoom. Renders at 1024 × 1024.</div>

  <h2>Camera</h2>
  <div class="ctl"><span>Around</span><input id="azimuth" type="range" min="-180" max="180" step="1"><output></output></div>
  <div class="ctl"><span>Height</span><input id="elevation" type="range" min="0" max="80" step="1"><output></output></div>
  <div class="ctl"><span>Distance</span><input id="distance" type="range" min="4" max="40" step="0.1"><output></output></div>
  <div class="ctl"><span>Lens (FOV)</span><input id="fov" type="range" min="10" max="90" step="1"><output></output></div>
  <div class="ctl"><span>Aim up</span><input id="aimY" type="range" min="-1" max="4" step="0.05"><output></output></div>
  <div class="ctl"><span>Aim ahead</span><input id="aimZ" type="range" min="-4" max="8" step="0.1"><output></output></div>
  <div class="ctl"><span>Aim side</span><input id="aimX" type="range" min="-4" max="4" step="0.1"><output></output></div>
  <div class="ctl"><span>Tilt</span><input id="tilt" type="range" min="-30" max="30" step="1"><output></output></div>

  <h2>Car</h2>
  <div class="ctl"><span>Lean</span><input id="lean" type="range" min="-45" max="45" step="1"><output></output></div>
  <div class="ctl"><span>Steer</span><input id="steer" type="range" min="-35" max="35" step="1"><output></output></div>
  <div class="ctl"><span>Bounce</span><input id="lift" type="range" min="0" max="2" step="0.02"><output></output></div>
  <div class="row"><span>Paint</span><input id="paint" type="color"></div>

  <h2>Scene</h2>
  <div class="row">
    <label class="check"><input id="shadows" type="checkbox"> Shadows</label>
  </div>
  <div class="ctl"><span>Sun around</span><input id="sunAz" type="range" min="-180" max="180" step="1"><output></output></div>
  <div class="ctl"><span>Sun height</span><input id="sunEl" type="range" min="5" max="85" step="1"><output></output></div>
  <div class="ctl"><span>Exposure</span><input id="exposure" type="range" min="0.4" max="2" step="0.02"><output></output></div>
  <div class="ctl"><span>Fog</span><input id="fog" type="range" min="0" max="1" step="0.01"><output></output></div>
  <div class="row"><span>Sky</span><input id="skyTop" type="color"><input id="skyBottom" type="color"><span>Grass</span><input id="grass" type="color"></div>

  <h2>Preview</h2>
  <div class="row" id="masks">
    <label class="check"><input type="radio" name="mask" value="none"> None</label>
    <label class="check"><input type="radio" name="mask" value="ios"> iOS</label>
    <label class="check"><input type="radio" name="mask" value="macos"> macOS</label>
    <label class="check"><input type="radio" name="mask" value="watchos"> watchOS</label>
  </div>

  <div class="row" style="margin-top:14px">
    <button class="primary" id="export" type="button">Export PNG</button>
    <button id="copy" type="button">Copy settings</button>
    <button id="reset" type="button">Reset</button>
  </div>
</div>

<script>
  if (location.protocol === 'file:') {
    document.getElementById('loading').textContent =
      'Serve the reference folder over http and open /icon-studio/.';
  }
</script>
<script type="module" src="./studio.js"></script>
</body>
</html>
