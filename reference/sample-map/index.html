<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample Map</title>
<style>
  :root {
    --surface: rgb(255 255 255 / 0.92);
    --border: #dcd9d0;
    --text: #1d1c1a;
    --muted: #6d6a62;
    --accent: #d98a00;
    --accent-text: #1d1c1a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: rgb(31 31 29 / 0.92); --border: #363632; --text: #ecebe6; --muted: #9a978e;
      --accent: #f2a72a; --accent-text: #151514; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --surface: rgb(31 31 29 / 0.92); --border: #363632; --text: #ecebe6; --muted: #9a978e;
    --accent: #f2a72a; --accent-text: #151514; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #bcd3e0; color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  .panel {
    position: fixed; top: 16px; left: 16px; max-width: calc(100vw - 32px); width: 300px;
    background: var(--surface); backdrop-filter: blur(8px);
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 4px 20px rgb(0 0 0 / 0.12);
  }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type="checkbox"] { accent-color: var(--accent); }
  button {
    font: inherit; color: var(--accent-text); background: var(--accent); border: none;
    padding: 6px 12px; border-radius: 8px; font-weight: 600; cursor: pointer;
  }
  .stats { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 5px 14px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: #33434d; font-size: 14px; pointer-events: none; }
  @media (max-width: 520px) { .hint { white-space: normal; text-align: center; width: calc(100vw - 32px); border-radius: 12px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="panel">
  <h1>Sample map</h1>
  <div class="sub" id="sub">Loading assets…</div>
  <div class="row">
    <label><input id="gridToggle" type="checkbox"> Tile grid</label>
    <label><input id="shadowToggle" type="checkbox" checked> Shadows</label>
    <button id="shuffle" type="button">Shuffle</button>
  </div>
  <div class="stats" id="stats"></div>
</div>
<div class="hint">Drag to pan · right-drag or two fingers to rotate · scroll or pinch to zoom</div>
<div class="loading" id="loading">Loading assets…</div>
<script>
  if (location.protocol === 'file:') {
    document.getElementById('loading').textContent =
      'Serve the reference folder over http (see viewer/index.html) and open /sample-map/.';
  }
</script>
<script type="module" src="./map.js"></script>
</body>
</html>
