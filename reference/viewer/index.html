<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Picker</title>
<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --surface-2: #ebe9e3;
    --border: #dcd9d0;
    --text: #1d1c1a;
    --muted: #6d6a62;
    --accent: #d98a00;
    --accent-soft: #fbedd2;
    --accent-text: #1d1c1a;
    --danger: #b3412e;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.06), 0 4px 14px rgb(0 0 0 / 0.05);
    --card-min: 180px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514;
      --surface: #1f1f1d;
      --surface-2: #2a2a27;
      --border: #363632;
      --text: #ecebe6;
      --muted: #9a978e;
      --accent: #f2a72a;
      --accent-soft: #3a2c12;
      --accent-text: #151514;
      --danger: #e0715d;
      --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --surface: #1f1f1d; --surface-2: #2a2a27; --border: #363632;
    --text: #ecebe6; --muted: #9a978e; --accent: #f2a72a; --accent-soft: #3a2c12;
    --accent-text: #151514; --danger: #e0715d; --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-bottom: 88px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 450; margin-left: 6px; }
  .search {
    flex: 1 1 220px; max-width: 360px;
    padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button {
    border: 1px solid var(--border); background: var(--surface);
    padding: 5px 10px; border-radius: 999px; font-size: 13px;
  }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .seg button .n { opacity: 0.6; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }
  .toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .toggles input[type="checkbox"] { accent-color: var(--accent); }
  .toggles input[type="range"] { width: 90px; accent-color: var(--accent); }
  .link-btn { background: none; border: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }
  .link-btn:hover { color: var(--text); }

  main { padding: 8px 16px 24px; }
  section h2 {
    font-size: 13px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin: 20px 0 10px; display: flex; gap: 10px; align-items: baseline;
  }
  section h2 .credit { text-transform: none; letter-spacing: 0; font-weight: 400; }
  section h2 a { color: inherit; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(var(--card-min), calc(50% - 5px)), 1fr)); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .card {
    position: relative; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; cursor: pointer; user-select: none;
    box-shadow: var(--shadow);
    transition: border-color 0.12s, transform 0.12s;
  }
  .card:hover { border-color: var(--muted); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .thumb {
    aspect-ratio: 4 / 3; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 60%, var(--surface) 0%, var(--surface-2) 100%);
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .wait { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--muted); animation: spin 0.8s linear infinite; }
  .thumb .err { color: var(--danger); font-size: 12px; padding: 8px; text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { padding: 8px 10px 10px; border-top: 1px solid var(--border); }
  .title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 1.4em; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge.anim { background: var(--accent-soft); color: var(--text); }
  .badge.dup { color: var(--danger); }
  .check {
    position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 6px;
    border: 1.5px solid var(--border); background: var(--surface);
    display: grid; place-items: center; color: transparent;
  }
  .card.selected .check { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .inspect {
    position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    display: grid; place-items: center; opacity: 0.85;
  }
  .inspect:hover { color: var(--text); opacity: 1; border-color: var(--muted); }

  .tray {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 16px; display: flex; gap: 12px; align-items: center;
    box-shadow: 0 -4px 20px rgb(0 0 0 / 0.08);
  }
  .tray .count { font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tray .names { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 550; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: 0.45; cursor: default; filter: none; }

  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translate(-50%, 8px);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  dialog {
    width: min(1100px, calc(100vw - 32px)); height: min(760px, calc(100vh - 32px));
    padding: 0; border: 1px solid var(--border); border-radius: 14px;
    background: var(--surface); color: var(--text); overflow: hidden;
  }
  dialog:focus { outline: none; }
  dialog::backdrop { background: rgb(0 0 0 / 0.5); }
  .insp { display: grid; grid-template-columns: 1fr 280px; height: 100%; }
  .stage { position: relative; background: radial-gradient(circle at 50% 55%, var(--surface) 0%, var(--surface-2) 100%); min-height: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .stage .wait { position: absolute; inset: 0; margin: auto; width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--muted); animation: spin 0.8s linear infinite; }
  .stage .hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); }
  .side { border-left: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
  .side h3 { margin: 0; font-size: 17px; word-break: break-word; }
  .side .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); word-break: break-all; }
  .side dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
  .side dt { color: var(--muted); }
  .side dd { margin: 0; font-variant-numeric: tabular-nums; }
  .side select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); }
  .side .grow { flex: 1; }
  .side .row { display: flex; gap: 8px; }
  .side .row .btn { flex: 1; }
  .close { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }

  @media (max-width: 720px) {
    .insp { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .side { border-left: none; border-top: 1px solid var(--border); max-height: 45vh; }
    .tray .names { display: none; }
    .tray { justify-content: space-between; }
  }
  .file-warning { max-width: 640px; margin: 48px auto; padding: 20px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
  .file-warning h2 { margin: 0 0 8px; font-size: 17px; }
  .file-warning p { margin: 8px 0; color: var(--muted); }
  .file-warning pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; color: var(--text); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>Asset Picker <small id="total"></small></h1>
  <input id="search" class="search" type="search" placeholder="Search names…" autocomplete="off">
  <div id="packs" class="seg" role="group" aria-label="Pack filter"></div>
  <div class="toggles">
    <label><input id="hideDupes" type="checkbox" checked> Hide duplicates</label>
    <label><input id="selectedOnly" type="checkbox"> Selected only</label>
    <label>Size <input id="cardSize" type="range" min="130" max="320" step="10" value="180"></label>
    <button id="selectVisible" class="link-btn" type="button">Select shown</button>
    <button id="deselectVisible" class="link-btn" type="button">Deselect shown</button>
  </div>
</header>

<main id="main"></main>

<div class="tray">
  <span id="count" class="count">0 selected</span>
  <span id="names" class="names"></span>
  <button id="clear" class="btn" type="button">Clear</button>
  <button id="copy" class="btn primary" type="button">Copy names</button>
</div>
<div id="toast" class="toast" role="status"></div>

<dialog id="inspector" aria-label="Asset inspector" tabindex="-1">
  <div class="insp">
    <div class="stage" id="stage">
      <div class="wait" id="stageWait"></div>
      <div class="hint">Drag to orbit · scroll to zoom · ← → browse · space selects</div>
    </div>
    <div class="side">
      <div>
        <h3 id="iTitle"></h3>
        <div class="path" id="iPath"></div>
      </div>
      <dl id="iStats"></dl>
      <div id="iAnimWrap" hidden>
        <div class="field-label">Animation</div>
        <select id="iAnim"></select>
      </div>
      <div class="grow"></div>
      <div class="row">
        <button class="btn" id="iPrev" type="button" aria-label="Previous">←</button>
        <button class="btn" id="iNext" type="button" aria-label="Next">→</button>
      </div>
      <button class="btn primary" id="iSelect" type="button">Select</button>
      <button class="btn" id="iClose" type="button">Close</button>
    </div>
  </div>
</dialog>

<script>
  // Browsers block module scripts and model files on file:// pages, so explain how to serve it instead.
  if (location.protocol === 'file:') {
    const dir = decodeURIComponent(location.pathname).replace(/\/viewer\/[^/]*$/, '');
    document.getElementById('main').innerHTML =
      '<div class="file-warning"><h2>This viewer needs a local web server</h2>' +
      '<p>Browsers don\'t let pages opened as files load 3D models. From a terminal, run:</p>' +
      '<pre></pre><p>Then open <a href="http://localhost:8642/viewer/">http://localhost:8642/viewer/</a>.</p></div>';
    document.querySelector('.file-warning pre').textContent = `python3 -m http.server 8642 --bind 127.0.0.1 -d "${dir}"`;
  }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
