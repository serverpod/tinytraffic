services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tinytraffic
      POSTGRES_PASSWORD: "g4cMgVVAQbNSZuwUbPbl3isbzvYu_fNr"
    volumes:
      - tinytraffic_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "ggvaMcbkaswXzhKBj4YH6Q3eGJA4Jb1G"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tinytraffic_test
      POSTGRES_PASSWORD: "g0_XAw0mu9keeOelQVyyZF_qGGz0wiUv"
    volumes:
      - tinytraffic_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "WHXoiSYmO8Lueam11HDuwz-tJh7Zl-TV"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  tinytraffic_data:
  tinytraffic_test_data:
